<app-nav></app-nav>
<button (click)="createNewProduct()">create</button>
<button (click)="onShowDetail('121')">Detalle Not Found</button>

<div class="products--grid">
    <app-product
    [product]="product"
    *ngFor="let product of products"
    (addedProduct)="onAddToShoppingCart($event)"
    (showProduct)="onShowDetail($event)"
    ></app-product>
    <button (click)="loadMOre()">Load More</button>
</div>
<div class="product-detail" [class.active]="showProductDetail">
  {{ statusDetail}}
    <div *ngIf="productChosen">
        <button (click)="toggleProductDetail()">Close</button>
        <h1>{{productChosen.product_title}}</h1>
        `
    <swiper
      [slidesPerView]="1">
      <ng-template swiperSlide *ngFor="let img of productChosen.product_photo">
        <img [src]="img" alt="">
      </ng-template>

    </swiper>
  `,
        <h1>{{productChosen.product_star_rating}}</h1>
   <button (click)="updateProduct()">editar</button>
   <button (click)="deleteProduct()">eliminar</button>

    </div> 
</div>
